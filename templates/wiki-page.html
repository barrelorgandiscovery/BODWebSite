{% extends "base.html" %}
{% block title %}{{ page.title }} | Wiki — {{ config.title }}{% endblock %}
{% block meta_desc %}
<meta name="description" content="{{ page.description | default(value='Documentation technique — wiki Barrel Organ Discovery') }}">
{% endblock %}
{% block content %}
<div class="container">
  <article class="wiki-content">
    <nav class="wiki-breadcrumb" aria-label="Fil d'Ariane">
      <a href="{{ get_url(path='@/_index.md') }}">Accueil</a>
      <span class="wiki-breadcrumb__sep" aria-hidden="true">/</span>
      <a href="{{ get_url(path='@/wiki/_index.md') }}">Wiki</a>
    </nav>
    {{ page.content | safe }}
  </article>
</div>
{% endblock %}
